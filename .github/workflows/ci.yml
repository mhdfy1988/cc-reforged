name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  smoke:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm.cmd install

      - name: Smoke
        env:
          CCR_SMOKE_SKIP_HEADLESS_AUTH_GATE: '1'
          ANTHROPIC_API_KEY: 'ci-smoke-placeholder'
        run: npm.cmd run ci:smoke
