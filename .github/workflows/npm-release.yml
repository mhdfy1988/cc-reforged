name: NPM Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to publish, for example v0.5.1
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish npm package via Trusted Publishing
    runs-on: windows-2022

    steps:
      - name: Checkout tag (manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Checkout tag (auto)
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $tag = '${{ inputs.tag }}'
          } else {
            $tag = '${{ github.ref_name }}'
          }
          if (-not $tag) {
            throw 'Unable to resolve release tag'
          }
          "value=$tag" >> $env:GITHUB_OUTPUT

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $pkgVersion = node -e "console.log(require('./package.json').version)"
          $expectedVersion = '${{ steps.release_tag.outputs.value }}'
          if ($expectedVersion.StartsWith('v')) {
            $expectedVersion = $expectedVersion.Substring(1)
          }
          if ($pkgVersion -ne $expectedVersion) {
            throw "Tag version mismatch: tag=${{ inputs.tag }} package.json=$pkgVersion"
          }

      - name: Install dependencies
        run: npm.cmd ci

      - name: Run core smoke gate
        env:
          CCR_SMOKE_SKIP_HEADLESS_AUTH_GATE: '1'
          ANTHROPIC_API_KEY: 'ci-smoke-placeholder'
        run: npm.cmd run ci:smoke

      - name: Validate package contents
        run: npm.cmd pack --dry-run

      - name: Publish to npm (OIDC Trusted Publishing)
        env:
          AUTHORIZED: '1'
        run: npm.cmd publish --access public
