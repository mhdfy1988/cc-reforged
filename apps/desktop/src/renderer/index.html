<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCR</title>
    <style>
      :root {
        color: #211b16;
        font-family:
          "HarmonyOS Sans SC",
          "MiSans",
          "Microsoft YaHei UI",
          "Segoe UI",
          sans-serif;
        background: #fbf4e9;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: #fbf4e9;
      }

      .boot-shell {
        position: relative;
        display: grid;
        place-items: center;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 45%, rgba(255, 253, 249, 0.68), transparent 34%),
          #fbf4e9;
      }

      .boot-shell::before {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 2;
        width: 42vw;
        height: 2px;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(239, 151, 0, 0.4),
          rgba(12, 143, 114, 0.38),
          transparent
        );
        content: '';
        animation: boot-progress-line 1.75s ease-in-out infinite;
      }

      .boot-mark {
        position: relative;
        display: grid;
        width: 52px;
        height: 52px;
        place-items: center;
        filter: drop-shadow(0 16px 34px rgba(76, 49, 20, 0.14));
        animation: boot-logo-breathe 1.8s ease-in-out infinite;
      }

      .boot-mark-image {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .boot-mark::after {
        position: absolute;
        right: -3px;
        bottom: -3px;
        width: 10px;
        height: 10px;
        border: 2px solid rgba(255, 253, 249, 0.96);
        border-radius: 999px;
        background: #0c8f72;
        box-shadow: 0 0 0 0 rgba(12, 143, 114, 0.38);
        content: '';
        animation: boot-status-pulse 1.35s ease-out infinite;
      }

      @keyframes boot-progress-line {
        0% {
          transform: translateX(-45vw);
          opacity: 0;
        }
        18%,
        82% {
          opacity: 1;
        }
        100% {
          transform: translateX(105vw);
          opacity: 0;
        }
      }

      @keyframes boot-logo-breathe {
        0%,
        100% {
          transform: scale(1);
          filter: brightness(1);
        }
        50% {
          transform: scale(1.045);
          filter: brightness(1.08);
        }
      }

      @keyframes boot-status-pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(12, 143, 114, 0.42);
          transform: scale(0.92);
        }
        70%,
        100% {
          box-shadow: 0 0 0 9px rgba(12, 143, 114, 0);
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-shell::before,
        .boot-mark,
        .boot-mark::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-shell" aria-label="CCR 正在启动">
        <div class="boot-mark" aria-hidden="true">
          <img class="boot-mark-image" src="./ccr-icon.png" alt="" />
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
